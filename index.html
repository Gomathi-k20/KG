<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eaf4ff;
        }

        .login-box {
            width: 380px;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .logo {
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #0d6efd;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .login {
            background: #0d6efd;
            color: white;
        }

        .login:hover {
            background: #0957c7;
        }

        .google-btn {
            background: white;
            color: #333;
            border: 1px solid #ccc;
        }

        .google-btn:hover {
            background: #f5f5f5;
        }

        .google-icon {
            color: #4285f4;
            font-size: 20px;
            font-weight: bold;
            margin-right: 8px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <!-- College Logo -->
        <img src="college-logo.png.png"
             alt="Adhiparasakthi Engineering College Logo"
             class="logo">

        <!-- Username -->
        <input type="text"
               id="username"
               placeholder="Username">

        <!-- Password -->
        <input type="password"
               id="password"
               placeholder="Password">

        <!-- Login -->
        <button class="login" onclick="login()">
            Login
        </button>

        <!-- Continue with Google -->
        <button class="google-btn" onclick="googleLogin()">
            <span class="google-icon">G</span>
            Continue with Google
        </button>

    </div>

    <script>
        function login() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (username === "" || password === "") {
                alert("Please enter username and password");
            } else {
                alert("Login Successful!");
            }
        }

        function googleLogin() {
            alert("Continue with Google clicked!");
        }
    </script>

</body>
</html>
